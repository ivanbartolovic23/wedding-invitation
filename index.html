<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iva & Ivan - Vjenčanje 27.6.2026</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Quicksand:wght@300;400;500;600;700&family=Akaya+Kanadaka&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f5f0eb;
            color: #2c2c2c;
            overflow-x: hidden;
            overflow-y: auto;
            touch-action: pan-y;
        }

        .container {
            position: relative;
            transition: transform 0.8s ease-in-out;
        }

        .container.slide-up {
            transform: translateY(-100vh);
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .page-1 {
            padding: 0;
            cursor: pointer;
            background-color: #f5f0eb;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }

        .page-1 img {
            max-width: 100%;
            max-height: 100vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .main-title {
            font-family: 'Caveat', cursive;
            font-size: clamp(28px, 7vw, 56px);
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        .couple-illustration {
            width: clamp(250px, 60vw, 400px);
            height: auto;
            margin: 40px 0;
        }

        .couple-names {
            font-family: 'Caveat', cursive;
            font-size: clamp(36px, 8vw, 56px);
            font-weight: 700;
            margin: 20px 0 10px;
            letter-spacing: 1px;
        }

        .wedding-date {
            font-size: clamp(16px, 3.5vw, 20px);
            color: #2c2c2c;
            margin-bottom: 15px;
            line-height: 1.8;
        }

        .wedding-date strong {
            font-size: clamp(22px, 5vw, 32px);
            font-weight: 700;
            display: block;
            margin: 15px 0;
        }

        .scroll-hint {
            font-size: 14px;
            color: #666;
            margin-top: 30px;
            animation: bounce 2s infinite;
            font-style: italic;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .page-2 {
            background-color: #f5f0eb;
            padding: 0;
        }

        .page-2 img {
            max-width: 100%;
            max-height: 100vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .page-3 {
            background-color: #fff;
            position: relative;
            padding: 0;
            justify-content: flex-start;
        }

        .page-3 img {
            max-width: 100%;
            max-height: 100vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .page-4 {
            background-color: #f5f0eb;
            padding: 0;
            display: none;
        }

        .page-4 img {
            max-width: 100%;
            max-height: 100vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .rsvp-form {
            position: absolute;
            bottom: -2vh;
            left: 50%;
            transform: translateX(-50%);
            width: 65%;
            max-width: 300px;
            padding: 8px;
            background: transparent;
            border-radius: 8px;
            margin-bottom: 5px;
            font-family: 'Akaya Kanadaka', cursive;
        }

        .form-group {
            margin-bottom: 8px;
            text-align: left;
        }

        label {
            display: block;
            font-size: clamp(11px, 2vw, 9px);
            margin-bottom: 3px;
            font-weight: 500;
        }

        input[type="text"],
        textarea {
            width: 100%;
            max-width: 100%;
            padding: 4px;
            border: 2px solid #2c2c2c;
            background-color: #f5f0eb;
            font-size: clamp(11px, 2vw, 9px);
            font-family: 'Akaya Kanadaka', cursive;
            box-sizing: border-box;
        }

        textarea {
            min-height: 40px;
            resize: vertical;
        }

        .guest-list {
            margin-bottom: 6px;
        }

        .guest-entry {
            display: flex;
            gap: 4px;
            margin-bottom: 4px;
            align-items: center;
        }

        .guest-entry input {
            flex: 1;
        }

        .remove-guest {
            background-color: #ff4444;
            color: white;
            border: none;
            padding: 4px 8px;
            cursor: pointer;
            font-size: clamp(12px, 2.2vw, 10px);
            font-weight: bold;
        }

        .add-guest {
            background-color: #2c2c2c;
            color: white;
            border: none;
            padding: 4px 10px;
            cursor: pointer;
            font-size: clamp(11px, 2vw, 9px);
            font-weight: bold;
            margin-bottom: 6px;
        }

        .add-guest:hover,
        .remove-guest:hover {
            opacity: 0.8;
        }

        .radio-group {
            display: flex;
            gap: 10px;
            margin-top: 3px;
            line-height: 1.2;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            font-size: clamp(11px, 2vw, 9px);
        }

        .radio-option input[type="radio"] {
            width: clamp(14px, 2.5vw, 12px);
            height: clamp(14px, 2.5vw, 12px);
            cursor: pointer;
        }

        .submit-btn {
            background-color: #2c2c2c;
            color: white;
            border: none;
            padding: 6px 16px;
            font-size: clamp(12px, 2.2vw, 10px);
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 6px;
            width: 100%;
            max-width: 100%;
        }

        .submit-btn:hover {
            background-color: #444;
        }

        .submit-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .success-message {
            background-color: #4CAF50;
            color: white;
            padding: 6px;
            margin-bottom: 6px;
            border-radius: 4px;
            display: none;
            font-size: clamp(11px, 2vw, 9px);
        }

        .error-message {
            background-color: #ff4444;
            color: white;
            padding: 6px;
            margin-bottom: 6px;
            border-radius: 4px;
            display: none;
            font-size: clamp(11px, 2vw, 9px);
        }

        @media (max-width: 768px) {
            .page {
                padding: 30px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <!-- Page 1: Main Invitation -->
        <div class="page page-1" id="page1" onclick="slideToNextPage()">
            <img src="C:\Users\zabrvai\Desktop\pozivnica\naslovna.png" alt="Iva i Ivan - Vjenčanje 27.6.2026">
        </div>

        <!-- Page 2: Details -->
        <div class="page page-2">
            <img src="C:\Users\zabrvai\Desktop\pozivnica\detalji.png" alt="Detalji">
        </div>

        <!-- Page 3: RSVP Form -->
        <div class="page page-3">
            <img src="C:\Users\zabrvai\Desktop\pozivnica\party_on.png" alt="RSVP">

        <div class="success-message" id="successMessage">
            Hvala! Vaš odgovor je uspješno poslan. 🎉
        </div>
        <div class="error-message" id="errorMessage">
            Došlo je do greške. Molimo pokušajte ponovo.
        </div>

        <form class="rsvp-form" id="rsvpForm">
            <div class="form-group">
                <label>Ljubazno vas molimo da potvrdite svoj dolazak:</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="attending" value="yes" required>
                        <span>Da, dolazim!</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="attending" value="no" required>
                        <span>Nažalost, ne mogu doći.</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Odaberite meni:</label>
                <div class="radio-group" style="flex-direction: column; gap: 3px;">
                    <label class="radio-option">
                        <input type="radio" name="menu" value="obicni" required>
                        <span>1. Obični</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="menu" value="vegetarijanski" required>
                        <span>2. Vegetarijanski</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="menu" value="veganski" required>
                        <span>3. Veganski</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="menu" value="gluten-free" required>
                        <span>4. Gluten free</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="menu" value="ostalo" required id="menuOstalo">
                        <span>5. Ostalo (molim navesti alergije):</span>
                    </label>
                </div>
                <input type="text" name="menuOther" id="menuOtherInput" placeholder="Navedite alergije ili posebne zahtjeve" style="margin-top: 10px; display: none;">
            </div>

            <div class="form-group">
                <label>Imena gostiju</label>
                <div class="guest-list" id="guestList">
                    <div class="guest-entry">
                        <input type="text" name="guest[]" placeholder="Ime i prezime" required>
                    </div>
                </div>
                <button type="button" class="add-guest" onclick="addGuest()">+ Dodaj gosta</button>
            </div>

            <button type="submit" class="submit-btn">Pošalji odgovor</button>
        </form>
    </div>

        <!-- Page 4: Final Page -->
        <div class="page page-4">
            <img src="C:\Users\zabrvai\Desktop\pozivnica\zadnja.png" alt="Final">
        </div>

    </div>

    <script>
        function slideToNextPage() {
            const container = document.getElementById('mainContainer');
            container.classList.add('slide-up');
        }

        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyIkLFVZIqH8iUTGwpfG_eMsF6aCCdDldsUUv_ah9L0BeQ5ds2JLA2RJCOEo0zEx3zE/exec';

        function addGuest() {
            const guestList = document.getElementById('guestList');
            const guestEntry = document.createElement('div');
            guestEntry.className = 'guest-entry';
            guestEntry.innerHTML = `
                <input type="text" name="guest[]" placeholder="Ime i prezime" required>
                <button type="button" class="remove-guest" onclick="removeGuest(this)">−</button>
            `;
            guestList.appendChild(guestEntry);
        }

        function removeGuest(button) {
            button.parentElement.remove();
        }

        document.getElementById('rsvpForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = this.querySelector('.submit-btn');
            const successMsg = document.getElementById('successMessage');
            const errorMsg = document.getElementById('errorMessage');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Šaljem...';
            successMsg.style.display = 'none';
            errorMsg.style.display = 'none';

            const formData = new FormData(this);
            const attending = formData.get('attending');
            const menu = formData.get('menu');
            const menuOther = formData.get('menuOther');
            const guests = formData.getAll('guest[]').filter(g => g.trim() !== '');

            const menuText = menu === 'ostalo' ? `Ostalo: ${menuOther}` : menu;

            const data = {
                attending: attending === 'yes' ? 'Da' : 'Ne',
                menu: menuText,
                guests: guests.join(', '),
                guestCount: guests.length,
                timestamp: new Date().toLocaleString('hr-HR')
            };

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                successMsg.style.display = 'block';
                this.reset();
                
                // Show final page after successful submission
                setTimeout(() => {
                    document.querySelector('.page-4').style.display = 'flex';
                    const container = document.getElementById('mainContainer');
                    container.style.transform = 'translateY(-300vh)';
                }, 2000);scrollIntoView({ behavior: 'smooth', block: 'center' });
                
            } catch (error) {
                console.error('Error:', error);
                errorMsg.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Pošalji odgovor';
            }
        });

        // Show/hide menu other input
        document.querySelectorAll('input[name="menu"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const otherInput = document.getElementById('menuOtherInput');
                if (this.value === 'ostalo') {
                    otherInput.style.display = 'block';
                    otherInput.required = true;
                } else {
                    otherInput.style.display = 'none';
                    otherInput.required = false;
                    otherInput.value = '';
                }
            });
        });
    </script>
</body>
</html>
