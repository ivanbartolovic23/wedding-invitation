<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iva & Ivan - Vjenčanje 27.6.2026</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Quicksand:wght@300;400;500;600;700&family=Akaya+Kanadaka&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f5f0eb;
            color: #2c2c2c;
            overflow: hidden;
        }

        .container {
            position: relative;
            transition: transform 0.8s ease-in-out;
            overflow-y: auto;
            height: 100vh;
        }

        .container.slide-up {
            transform: translateY(-100vh);
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .page-1 {
            padding: 0;
            cursor: pointer;
            background-color: #f5f0eb;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .page-1.hidden {
            display: none;
        }

        .page-1 img, .page-2 img, .page-3 img, .page-4 img, .page-5 img {
            max-width: 100%;
            max-height: 100vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .page-2, .page-3, .page-4, .page-5 {
            background-color: #f5f0eb;
            padding: 0;
        }

        .page-4 {
            background-color: #fff;
            position: relative;
            justify-content: flex-start;
            padding: 20px;
        }

        .page-5 {
            display: none;
            overflow: hidden;
        }

        .page-5.active {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
        }

        .rsvp-form {
            position: absolute;
            bottom: -2vh;
            left: 50%;
            transform: translateX(-50%);
            width: 65%;
            max-width: 300px;
            padding: 8px;
            background: transparent;
            border-radius: 8px;
            margin-bottom: 5px;
            font-family: 'Akaya Kanadaka', cursive;
        }

        .guest-form {
            width: 90%;
            max-width: 600px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            font-family: 'Akaya Kanadaka', cursive;
            max-height: 80vh;
            overflow-y: auto;
            margin: 20px auto;
        }

        .form-group {
            margin-bottom: 12px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 16px;
            margin-bottom: 5px;
            font-weight: 500;
        }

        input[type="text"], textarea {
            width: 100%;
            max-width: 100%;
            padding: 8px;
            border: 2px solid #2c2c2c;
            background-color: #f5f0eb;
            font-size: 16px;
            font-family: 'Akaya Kanadaka', cursive;
            box-sizing: border-box;
        }

        .guest-list {
            margin-bottom: 10px;
        }

        .guest-item {
            margin-bottom: 20px;
            padding: 15px;
            border: 2px solid #2c2c2c;
            border-radius: 8px;
            background: #f5f0eb;
        }

        .guest-entry {
            display: flex;
            gap: 5px;
            margin-bottom: 5px;
            align-items: center;
        }

        .guest-entry input {
            flex: 1;
        }

        .remove-guest {
            background-color: #ff4444;
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .add-guest {
            background-color: #2c2c2c;
            color: white;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .add-guest:hover, .remove-guest:hover {
            opacity: 0.8;
        }

        .radio-group {
            display: flex;
            gap: 10px;
            margin-top: 5px;
            line-height: 1.2;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .radio-option input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .submit-btn {
            background-color: #2c2c2c;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 10px;
            width: 100%;
            max-width: 100%;
        }

        .submit-btn:hover {
            background-color: #444;
        }

        .submit-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .success-message {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            display: none;
            font-size: 15px;
        }

        .error-message {
            background-color: #ff4444;
            color: white;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            display: none;
            font-size: 15px;
        }

        @media (max-width: 768px) {
            .page {
                padding: 30px 15px;
            }
        }
    </style>
</head>
<body>
<div class="container" id="mainContainer">
    <!-- Page 1: Main Invitation -->
    <div class="page page-1" id="page1" onclick="slideToNextPage()">
        <img src="naslovna.png" alt="Iva i Ivan - Vjenčanje 27.6.2026">
    </div>

    <!-- Page 2: Details -->
    <div class="page page-2">
        <img src="detalji.png" alt="Detalji">
    </div>

    <!-- Page 3: RSVP Attendance -->
    <div class="page page-3">
        <img src="party_on.png" alt="RSVP">

        <form class="rsvp-form" id="attendanceForm">
            <div class="form-group">
                <label>Ljubazno vas molimo da potvrdite svoj dolazak:</label>
                <div class="radio-group" style="flex-direction: column; gap: 8px;">
                    <label class="radio-option">
                        <input type="radio" name="attending" value="yes" required>
                        <span>Da, dolazim!</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="attending" value="no" required>
                        <span>Nažalost, ne mogu doći.</span>
                    </label>
                </div>
            </div>
            <button type="submit" class="submit-btn">Nastavi</button>
        </form>
    </div>

    <!-- Page 4: Guest Details -->
    <div class="page page-4" style="display: none;">
        <div class="success-message" id="successMessage">
            Hvala! Vaš odgovor je uspješno poslan. 🎉
        </div>
        <div class="error-message" id="errorMessage">
            Došlo je do greške. Molimo pokušajte ponovo.
        </div>

        <form class="guest-form" id="guestForm">
            <div id="guestList"></div>
            <button type="button" class="add-guest" onclick="addGuest()">+ Dodaj gosta</button>
            <button type="submit" class="submit-btn">Pošalji odgovor</button>
        </form>
    </div>

    <!-- Page 5: Final Page -->
    <div class="page page-5">
        <img src="zadnja.png" alt="Final">
    </div>
</div>

<script>
    let guestCount = 0;
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyIkLFVZIqH8iUTGwpfG_eMsF6aCCdDldsUUv_ah9L0BeQ5ds2JLA2RJCOEo0zEx3zE/exec';

    function slideToNextPage() {
        const page1 = document.getElementById('page1');
        page1.classList.add('hidden');
        document.body.style.overflow = 'auto';
    }

    // Handle attendance form
    document.getElementById('attendanceForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const attending = document.querySelector('input[name="attending"]:checked').value;

        if (attending === 'no') {
            // Show final page
            showFinalPage();
        } else {
            // Show guest details page
            document.querySelector('.page-4').style.display = 'flex';
            document.querySelector('.page-4').scrollIntoView({ behavior: 'smooth' });
            addGuest(); // Add first guest
        }
    });

    function addGuest() {
        guestCount++;
        const guestList = document.getElementById('guestList');
        const guestItem = document.createElement('div');
        guestItem.className = 'guest-item';
        guestItem.id = `guest-${guestCount}`;
        guestItem.innerHTML = `
            <div class="form-group">
                <label>Ime i prezime gosta ${guestCount}:</label>
                <div class="guest-entry">
                    <input type="text" name="guest-name-${guestCount}" placeholder="Ime i prezime" required>
                    ${guestCount > 1 ? `<button type="button" class="remove-guest" onclick="removeGuest(${guestCount})">−</button>` : ''}
                </div>
            </div>
            <div class="form-group">
                <label>Odaberite meni za gosta ${guestCount}:</label>
                <div class="radio-group" style="flex-direction: column; gap: 5px;">
                    <label class="radio-option">
                        <input type="radio" name="menu-${guestCount}" value="obicni" required>
                        <span>1. Obični</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="menu-${guestCount}" value="vegetarijanski" required>
                        <span>2. Vegetarijanski</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="menu-${guestCount}" value="veganski" required>
                        <span>3. Veganski</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="menu-${guestCount}" value="gluten-free" required>
                        <span>4. Gluten free</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="menu-${guestCount}" value="ostalo" required>
                        <span>5. Ostalo (molim navesti alergije):</span>
                    </label>
                </div>
                <input type="text" name="menu-other-${guestCount}" placeholder="Navedite alergije ili posebne zahtjeve" style="margin-top: 8px; display: none;">
            </div>
        `;
        guestList.appendChild(guestItem);

        // Add event listener for "ostalo" option
        const radioButtons = guestItem.querySelectorAll(`input[name="menu-${guestCount}"]`);
        const otherInput = guestItem.querySelector(`input[name="menu-other-${guestCount}"]`);
        radioButtons.forEach(radio => {
            radio.addEventListener('change', function() {
                if (this.value === 'ostalo') {
                    otherInput.style.display = 'block';
                    otherInput.required = true;
                } else {
                    otherInput.style.display = 'none';
                    otherInput.required = false;
                    otherInput.value = '';
                }
            });
        });
    }

    function removeGuest(id) {
        document.getElementById(`guest-${id}`).remove();
    }

    // Handle guest form submission
    document.getElementById('guestForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const submitBtn = this.querySelector('.submit-btn');
        const successMsg = document.getElementById('successMessage');
        const errorMsg = document.getElementById('errorMessage');

        submitBtn.disabled = true;
        submitBtn.textContent = 'Šaljem...';
        successMsg.style.display = 'none';
        errorMsg.style.display = 'none';

        const formData = new FormData(this);
        const guests = [];

        for (let i = 1; i <= guestCount; i++) {
            const guestElement = document.getElementById(`guest-${i}`);
            if (guestElement) {
                const name = formData.get(`guest-name-${i}`);
                const menu = formData.get(`menu-${i}`);
                const menuOther = formData.get(`menu-other-${i}`);
                const menuText = menu === 'ostalo' ? `Ostalo: ${menuOther}` : menu;
                guests.push({ name, menu: menuText });
            }
        }

        const data = {
            attending: 'Da',
            guests: guests.map(g => `${g.name} (${g.menu})`).join(', '),
            guestCount: guests.length,
            timestamp: new Date().toLocaleString('hr-HR')
        };

        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            });

            successMsg.style.display = 'block';
            setTimeout(() => {
                showFinalPage();
            }, 2000);

        } catch (error) {
            console.error('Error:', error);
            errorMsg.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Pošalji odgovor';
        }
    });

    function showFinalPage() {
        const finalPage = document.querySelector('.page-5');
        finalPage.classList.add('active');
        document.body.style.overflow = 'hidden';
    }
</script>
</body>
</html>
