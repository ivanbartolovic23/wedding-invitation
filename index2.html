<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iva & Ivan - Vjenčanje 27.6.2026</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Quicksand:wght@300;400;500;600;700&family=Akaya+Kanadaka&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f5f0eb;
            color: #2c2c2c;
            overflow: hidden;
        }

        .container {
            height: 100vh;
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            scroll-snap-align: start;
            position: relative;
        }

        .page img {
            max-width: 100%;
            max-height: 100vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        /* Page 1 - Fixed Overlay */
        .page-1 {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10000;
            cursor: pointer;
            background-color: #f5f0eb;
            padding: 0;
        }

        .page-1.hidden {
            display: none;
        }

        /* Page 2 - Details */
        .page-2 {
            background-color: #f5f0eb;
            padding: 0;
        }

        /* Page 3 - RSVP Attendance */
        .page-3 {
            background-color: #fff;
            position: relative;
            padding: 0;
        }

        /* Page 4 - Guest Details */
        .page-4 {
            background-color: #fff;
            padding: 20px;
            display: none;
        }

        /* Page 5 - Final */
        .page-5 {
            display: none;
        }

        .page-5.active {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10001;
        }

        /* Forms */
        .rsvp-form {
            position: absolute;
            bottom: -2vh;
            left: 50%;
            transform: translateX(-50%);
            width: 65%;
            max-width: 300px;
            padding: 8px;
            background: transparent;
            font-family: 'Akaya Kanadaka', cursive;
        }

        .guest-form {
            width: 90%;
            max-width: 600px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            font-family: 'Akaya Kanadaka', cursive;
            max-height: 80vh;
            overflow-y: auto;
            margin: 20px auto;
        }

        .form-group {
            margin-bottom: 12px;
            text-align: left;
        }

        .form-group-vertical {
            flex-direction: column;
            gap: 8px;
        }

        label {
            display: block;
            font-size: 16px;
            margin-bottom: 5px;
            font-weight: 500;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 8px;
            border: 2px solid #2c2c2c;
            background-color: #f5f0eb;
            font-size: 16px;
            font-family: 'Akaya Kanadaka', cursive;
        }

        .guest-list {
            margin-bottom: 10px;
        }

        .guest-item {
            margin-bottom: 20px;
            padding: 15px;
            border: 2px solid #2c2c2c;
            border-radius: 8px;
            background: #f5f0eb;
        }

        .guest-entry {
            display: flex;
            gap: 5px;
            margin-bottom: 5px;
            align-items: center;
        }

        .guest-entry input {
            flex: 1;
        }

        .radio-group {
            display: flex;
            gap: 10px;
            margin-top: 5px;
            line-height: 1.2;
        }

        .radio-group-vertical {
            flex-direction: column;
            gap: 5px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .radio-option input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* Buttons */
        .btn {
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Akaya Kanadaka', cursive;
        }

        .btn-primary {
            background-color: #2c2c2c;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            text-transform: uppercase;
            margin-top: 10px;
            width: 100%;
        }

        .btn-primary:hover {
            background-color: #444;
        }

        .btn-primary:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .btn-add {
            background-color: #2c2c2c;
            color: white;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .btn-add:hover {
            opacity: 0.8;
        }

        .btn-remove {
            background-color: #ff4444;
            color: white;
            font-size: 16px;
            padding: 8px 12px;
        }

        .btn-remove:hover {
            opacity: 0.8;
        }

        /* Messages */
        .message {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            display: none;
            font-size: 15px;
        }

        .message-success {
            background-color: #4CAF50;
            color: white;
        }

        .message-error {
            background-color: #ff4444;
            color: white;
        }

        .hidden-input {
            margin-top: 8px;
            display: none;
        }

        @media (max-width: 768px) {
            .page {
                padding: 30px 15px;
            }
        }
    </style>
</head>
<body>
<div class="container" id="mainContainer">
    <!-- Page 1: Main Invitation -->
    <div class="page page-1" id="page1">
        <img src="naslovna.png" alt="Iva i Ivan - Vjenčanje 27.6.2026">
    </div>

    <!-- Page 2: Details -->
    <div class="page page-2">
        <img src="detalji.png" alt="Detalji">
    </div>

    <!-- Page 3: RSVP Attendance -->
    <div class="page page-3">
        <img src="party_on.png" alt="RSVP">

        <form class="rsvp-form" id="attendanceForm">
            <div class="form-group">
                <label>Ljubazno vas molimo da potvrdite svoj dolazak:</label>
                <div class="radio-group form-group-vertical">
                    <label class="radio-option">
                        <input type="radio" name="attending" value="yes" required>
                        <span>Da, dolazim!</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="attending" value="no" required>
                        <span>Nažalost, ne mogu doći.</span>
                    </label>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Nastavi</button>
        </form>
    </div>

    <!-- Page 4: Guest Details -->
    <div class="page page-4">
        <div class="message message-success" id="successMessage">
            Hvala! Vaš odgovor je uspješno poslan. 🎉
        </div>
        <div class="message message-error" id="errorMessage">
            Došlo je do greške. Molimo pokušajte ponovo.
        </div>

        <form class="guest-form" id="guestForm">
            <div id="guestList" class="guest-list"></div>
            <button type="button" class="btn btn-add" id="addGuestBtn">+ Dodaj gosta</button>
            <button type="submit" class="btn btn-primary">Pošalji odgovor</button>
        </form>
    </div>

    <!-- Page 5: Final Page -->
    <div class="page page-5">
        <img src="zadnja.png" alt="Final">
    </div>
</div>

<script>
    (function() {
        'use strict';

        let guestCount = 0;
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyIkLFVZIqH8iUTGwpfG_eMsF6aCCdDldsUUv_ah9L0BeQ5ds2JLA2RJCOEo0zEx3zE/exec';

        // Elements
        const page1 = document.getElementById('page1');
        const page4 = document.querySelector('.page-4');
        const page5 = document.querySelector('.page-5');
        const attendanceForm = document.getElementById('attendanceForm');
        const guestForm = document.getElementById('guestForm');
        const addGuestBtn = document.getElementById('addGuestBtn');
        const guestList = document.getElementById('guestList');
        const successMsg = document.getElementById('successMessage');
        const errorMsg = document.getElementById('errorMessage');

        // Page 1 click handler
        page1.addEventListener('click', function() {
            page1.classList.add('hidden');
            document.body.style.overflow = 'auto';
        });

        // Attendance form handler
        attendanceForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const attending = document.querySelector('input[name="attending"]:checked').value;

            if (attending === 'no') {
                showFinalPage();
            } else {
                page4.style.display = 'flex';
                page4.scrollIntoView({ behavior: 'smooth' });
                addGuest();
            }
        });

        // Add guest button
        addGuestBtn.addEventListener('click', addGuest);

        // Guest form submission
        guestForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = this.querySelector('.btn-primary');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Šaljem...';
            successMsg.style.display = 'none';
            errorMsg.style.display = 'none';

            const guests = collectGuestData();
            const data = {
                attending: 'Da',
                guests: guests.map(g => `${g.name} (${g.menu})`).join(', '),
                guestCount: guests.length,
                timestamp: new Date().toLocaleString('hr-HR')
            };

            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                successMsg.style.display = 'block';
                setTimeout(showFinalPage, 2000);

            } catch (error) {
                console.error('Error:', error);
                errorMsg.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Pošalji odgovor';
            }
        });

        function addGuest() {
            guestCount++;
            const guestItem = createGuestItem(guestCount);
            guestList.appendChild(guestItem);
        }

        function createGuestItem(id) {
            const div = document.createElement('div');
            div.className = 'guest-item';
            div.id = `guest-${id}`;
            div.innerHTML = `
                <div class="form-group">
                    <label>Ime i prezime gosta ${id}:</label>
                    <div class="guest-entry">
                        <input type="text" name="guest-name-${id}" placeholder="Ime i prezime" required>
                        ${id > 1 ? `<button type="button" class="btn btn-remove" data-guest-id="${id}">−</button>` : ''}
                    </div>
                </div>
                <div class="form-group">
                    <label>Odaberite meni za gosta ${id}:</label>
                    <div class="radio-group radio-group-vertical">
                        <label class="radio-option">
                            <input type="radio" name="menu-${id}" value="obicni" required>
                            <span>1. Obični</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="menu-${id}" value="vegetarijanski" required>
                            <span>2. Vegetarijanski</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="menu-${id}" value="veganski" required>
                            <span>3. Veganski</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="menu-${id}" value="gluten-free" required>
                            <span>4. Gluten free</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="menu-${id}" value="ostalo" required>
                            <span>5. Ostalo (molim navesti alergije):</span>
                        </label>
                    </div>
                    <input type="text" name="menu-other-${id}" placeholder="Navedite alergije ili posebne zahtjeve" class="hidden-input">
                </div>
            `;

            // Event delegation for remove button
            const removeBtn = div.querySelector('.btn-remove');
            if (removeBtn) {
                removeBtn.addEventListener('click', function() {
                    div.remove();
                });
            }

            // Menu "ostalo" handler
            const radioButtons = div.querySelectorAll(`input[name="menu-${id}"]`);
            const otherInput = div.querySelector(`input[name="menu-other-${id}"]`);
            radioButtons.forEach(radio => {
                radio.addEventListener('change', function() {
                    if (this.value === 'ostalo') {
                        otherInput.style.display = 'block';
                        otherInput.required = true;
                    } else {
                        otherInput.style.display = 'none';
                        otherInput.required = false;
                        otherInput.value = '';
                    }
                });
            });

            return div;
        }

        function collectGuestData() {
            const guests = [];
            const formData = new FormData(guestForm);

            for (let i = 1; i <= guestCount; i++) {
                const guestElement = document.getElementById(`guest-${i}`);
                if (guestElement) {
                    const name = formData.get(`guest-name-${i}`);
                    const menu = formData.get(`menu-${i}`);
                    const menuOther = formData.get(`menu-other-${i}`);
                    const menuText = menu === 'ostalo' ? `Ostalo: ${menuOther}` : menu;
                    guests.push({ name, menu: menuText });
                }
            }
            return guests;
        }

        function showFinalPage() {
            page5.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
    })();
</script>
</body>
</html>
